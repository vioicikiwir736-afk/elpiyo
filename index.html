<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A Letter for You</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Yellowtail&display=swap" rel="stylesheet" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#000;color:#fff;font-family:"Courier New",monospace;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:12px;overflow-x:hidden;overflow-y:hidden;padding:20px 0;
}
body::after{ /* grain halus */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:9;opacity:.07;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.script{font-family:"Yellowtail","Kaushan Script","Brush Script MT",cursive;font-weight:400}

/* ===== jam ===== */
.clockwrap{
  flex:none;margin-top:auto;width:min(84vw,50dvh,500px);aspect-ratio:1;
  transition:opacity 1.1s ease,transform 1.4s cubic-bezier(.2,.7,.2,1);
}
.clockwrap svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 7px rgba(255,255,255,.35))}
#ring{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s .2s cubic-bezier(.5,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.lbl{fill:#fff;font-family:"Yellowtail","Kaushan Script","Brush Script MT",cursive;text-anchor:middle;dominant-baseline:central;opacity:0;animation:fade .9s ease forwards}
@keyframes fade{to{opacity:1}}
.hands{opacity:0;animation:fade 1s 3.2s ease forwards}
.hand{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round}
#hMin,#hHr{stroke-width:4.2}
#hSec{stroke-width:1.4;opacity:.75}
#hub{fill:#000;stroke:#fff;stroke-width:4}
body.reading .clockwrap{opacity:.17;transform:scale(1.25)}

/* ===== info bawah jam ===== */
.meta,.intro,.btn{opacity:0;animation:fade 1s 3.3s ease forwards;transition:visibility 0s .7s}
.meta{display:flex;flex-direction:column;align-items:center;gap:8px}
.digital{display:flex;align-items:baseline;gap:10px;letter-spacing:3px;font-size:1.15rem;text-shadow:0 0 10px rgba(255,255,255,.6)}
.digital b{font-weight:400;font-size:.8rem;letter-spacing:2px;border:1px solid #fff;padding:1px 7px;border-radius:99px}
.chips{display:flex;gap:6px}
.chip{background:none;border:1px solid rgba(255,255,255,.45);color:#fff;font:inherit;font-size:.7rem;letter-spacing:2px;padding:3px 10px;border-radius:99px;cursor:pointer;transition:.2s}
.chip:hover{border-color:#fff}
.chip.on{background:#fff;color:#000;border-color:#fff}
.intro{text-align:center;font-size:1.9rem;line-height:1.2;margin:6px 20px 2px;text-shadow:0 0 12px rgba(255,255,255,.5)}
.btn{margin-bottom:auto;position:relative;background:#000;color:#fff;border:0;padding:10px 30px;font-size:1.5rem;cursor:pointer;transition:.25s}
.btn::before,.letter::before{content:"";position:absolute;inset:0;border:2.5px solid #fff;border-radius:6px;filter:url(#rough);pointer-events:none}
.btn:hover{background:#fff;color:#000}
body.reading .meta,body.reading .intro,body.reading .btn{animation:none;opacity:0;visibility:hidden}


/* ===== setelah surat ditutup ===== */
body.closed{overflow-y:auto}
body.closed .clockwrap{width:min(56vw,24dvh,320px);opacity:1;transform:none;cursor:pointer}
body.closed .meta{animation:none;opacity:1;visibility:visible}
body.closed .intro,body.closed .btn{display:none}
.poem{display:none;flex:none;width:min(88vw,460px);text-align:center;margin:14px 0 auto;padding-bottom:48px;color:rgba(255,255,255,.8);font-size:clamp(.74rem,3.2vw,1rem);line-height:1.7}
body.closed .poem{display:block}
.poem .st{margin-bottom:1.1em}
.poem .ln{display:block}
.poem em{font-style:normal;color:#fff;font-family:"Yellowtail","Kaushan Script","Brush Script MT",cursive;font-size:1.4em;text-shadow:0 0 14px rgba(255,255,255,.75)}
.poem .fin{font-size:clamp(1.5rem,6.4vw,2.1rem);line-height:1.3;color:#fff;margin-top:.2em;text-shadow:0 0 16px rgba(255,255,255,.7)}
.poem .hint{margin-top:1.6em;font-size:.7rem;letter-spacing:3px;color:rgba(255,255,255,.38)}
@media (max-width:899px){body.closed .chips{display:none}}
@media (min-width:900px) and (min-height:520px){
  body.closed{display:grid;grid-template-columns:auto minmax(0,540px);grid-template-areas:"clock poem" "meta poem";justify-content:center;align-content:safe center;column-gap:72px;row-gap:12px;padding:30px}
  body.closed .clockwrap{grid-area:clock;align-self:end;margin:0;width:min(38vw,64dvh,460px)}
  body.closed .meta{grid-area:meta;align-self:start;justify-self:center}
  body.closed .poem{grid-area:poem;margin:0;padding:0;text-align:left;align-self:center;font-size:1.02rem}
}
.letter.out{animation:outa .45s ease forwards}
@keyframes outa{to{opacity:0;transform:translate(-50%,-53%)}}

/* ===== surat ===== */
.letter{
  display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;
  width:min(92vw,520px);background:#000;cursor:pointer;
  box-shadow:0 0 60px rgba(255,255,255,.08);
}
.letter.show{display:block;animation:in .9s ease both}
@keyframes in{from{opacity:0;transform:translate(-50%,-47%)}to{opacity:1;transform:translate(-50%,-50%)}}
.letter::before{inset:6px}
.scroll{max-height:84dvh;overflow-y:auto;scrollbar-width:none;padding:34px 30px 84px}
.scroll::-webkit-scrollbar{display:none}
#typed{font-size:1.05rem;line-height:1.75;white-space:pre-wrap;overflow-wrap:break-word;text-shadow:0 0 8px rgba(255,255,255,.4)}
.cur{display:inline-block;width:.55em;background:#fff;animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sig{position:absolute;right:22px;bottom:12px;width:120px;pointer-events:none;opacity:0;transform:rotate(-2deg);transition:opacity 1.8s ease;filter:invert(1) drop-shadow(0 0 6px rgba(255,255,255,.7))}
.letter.done .sig{opacity:.92}

/* tombol musik kecil */
.music{position:fixed;top:14px;right:14px;z-index:10;width:34px;height:34px;border-radius:50%;background:none;border:1px solid rgba(255,255,255,.45);color:#fff;font-size:.95rem;cursor:pointer;display:none;transition:.2s}
.music.show{display:block}
.music:hover{border-color:#fff}
.music.off{opacity:.45;text-decoration:line-through}

@media (max-width:480px){.intro{font-size:1.5rem}.scroll{padding:28px 22px 80px}#typed{font-size:.95rem}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
</svg>

<div class="clockwrap" id="clockwrap">
  <svg viewBox="-108 -108 216 216" role="img" aria-label="Jam analog">
    <path id="ring" pathLength="1"/>
    <g id="labels"></g>
    <g class="hands">
      <g id="hHr"  class="hand"><path d="M0 -8 Q-1.2 -18 0 -30"/><path d="M-5 -25 L0 -32 L5 -25"/></g>
      <g id="hMin" class="hand"><path d="M0 -8 Q1.4 -26 0 -44"/><path d="M-5.5 -37 L0 -45 L5.5 -37"/></g>
      <g id="hSec" class="hand"><path d="M0 12 L0 -72"/></g>
      <ellipse id="hub" rx="7.6" ry="6.8" transform="rotate(-12)"/>
    </g>
  </svg>
</div>

<div class="meta" id="meta">
  <div class="digital"><span id="dg">--:--:--</span><b id="zn">--</b></div>
  <div class="chips" id="chips">
    <button class="chip on" data-z="">AUTO</button>
    <button class="chip" data-z="Asia/Jakarta">WIB</button>
    <button class="chip" data-z="Asia/Makassar">WITA</button>
    <button class="chip" data-z="Asia/Jayapura">WIT</button>
  </div>
</div>

<div class="intro script" id="intro">i hope you read this, even if it's too late.</div>
<button class="btn script" id="readBtn">Read it</button>

<div class="poem" id="poem"></div>

<audio id="bgm" src="merry-christmas-i-miss-you.mp3" preload="auto"></audio>
<button class="music" id="musicBtn" aria-label="Musik">&#9835;</button>

<script>
const message = `I don’t even know if you’ll ever read this.\nBut if you do… I just want you to know, I still think about you sometimes.\n\nWe both tried. We both cared. But the universe just never gave us enough space to become “us.”\n\nI just wonder… if we had met at a different point in life, would the ending have been different?\n\nAnyway, I hope you're doing okay, even though we’re not in each other’s lives anymore.`;

/* ---------- lingkaran jam gaya gambar tangan ---------- */
(function(){
  const R=92,N=150,ph=[0,1,2].map(()=>Math.random()*6.28);let d="";
  for(let i=0;i<=N+8;i++){
    const t=i/N*Math.PI*2-Math.PI/2-.3;
    const w=2.6*Math.sin(2*t+ph[0])+1.6*Math.sin(3*t+ph[1])+.9*Math.sin(5*t+ph[2]);
    const r=R+w+(i/N)*2.4;
    d+=(i?"L":"M")+(r*Math.cos(t)).toFixed(2)+" "+(r*Math.sin(t)).toFixed(2);
  }
  document.getElementById("ring").setAttribute("d",d);

  // "Miss u" di tiap jam: 12,3,6,9 lebih besar (seperti gambar)
  const size=[13,9.5,8.5,13,9,9.5,13,9.5,9,13,10.5,9.5];
  const g=document.getElementById("labels");
  for(let i=0;i<12;i++){
    const a=i*30*Math.PI/180,r=size[i]>12?69:70;
    const el=document.createElementNS("http://www.w3.org/2000/svg","text");
    el.setAttribute("x",(r*Math.sin(a)).toFixed(2));
    el.setAttribute("y",(-r*Math.cos(a)).toFixed(2));
    el.setAttribute("font-size",size[i]);
    el.setAttribute("class","lbl");
    el.style.animationDelay=(1.5+i*.13)+"s";
    el.textContent="Miss u";
    g.appendChild(el);
  }
})();

/* ---------- jam live sesuai zona waktu pengunjung ---------- */
const ID_ZONE={"Asia/Jakarta":"WIB","Asia/Pontianak":"WIB","Asia/Makassar":"WITA","Asia/Jayapura":"WIT"};
let zone="";                       // "" = otomatis (zona perangkat)
const fmts={};
function fmt(z){
  return fmts[z]||(fmts[z]=new Intl.DateTimeFormat("en-GB",{
    timeZone:z||undefined,hourCycle:"h23",hour:"2-digit",minute:"2-digit",second:"2-digit",timeZoneName:"short"}));
}
function zoneLabel(z,partsName){
  const real=z||Intl.DateTimeFormat().resolvedOptions().timeZone;
  return ID_ZONE[real]||partsName||real;
}
function read(date){
  const o={};fmt(zone).formatToParts(date).forEach(p=>o[p.type]=p.value);
  return {h:+o.hour,m:+o.minute,s:+o.second,tz:zoneLabel(zone,o.timeZoneName)};
}
const $=id=>document.getElementById(id);
let lastSec=-1,H=0,M=0,S=0;
function frame(){
  const now=Date.now(),sec=Math.floor(now/1000);
  if(sec!==lastSec){
    lastSec=sec;const p=read(new Date(now));H=p.h;M=p.m;S=p.s;
    $("dg").textContent=[H,M,S].map(n=>String(n).padStart(2,"0")).join(":");
    $("zn").textContent=p.tz;
  }
  const s=S+(now%1000)/1000,m=M+s/60,h=(H%12)+m/60;
  $("hSec").setAttribute("transform","rotate("+(s*6)+")");
  $("hMin").setAttribute("transform","rotate("+(m*6)+")");
  $("hHr").setAttribute("transform","rotate("+(h*30)+")");
  requestAnimationFrame(frame);
}
frame();
$("chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b));
  zone=b.dataset.z;lastSec=-1;
});

/* ---------- surat ---------- */
const letter=$("letter"),typed=$("typed");

/* ---------- musik ---------- */
// Taruh file lagunya di folder yang sama dengan index.html, namanya: merry-christmas-i-miss-you.mp3
// START_AT = detik awal pas pertama kali diputar (0:52 = 52). Saat diulang, mulai dari 0.
const START_AT=52;
const bgm=$("bgm"),musicBtn=$("musicBtn");
let muted=false;
function startMusic(){
  if(muted||!bgm.paused)return;
  const go=()=>{try{bgm.currentTime=START_AT;}catch(e){} bgm.play().then(()=>musicBtn.classList.add("show")).catch(()=>{});};
  if(bgm.readyState>0)go();else{bgm.addEventListener("loadedmetadata",go,{once:true});bgm.load();}
}
bgm.addEventListener("ended",()=>{bgm.currentTime=0;bgm.play().catch(()=>{});});
musicBtn.addEventListener("click",e=>{
  e.stopPropagation();
  muted=!muted;musicBtn.classList.toggle("off",muted);
  if(muted)bgm.pause();else bgm.play().catch(()=>{});
});
let opened=false,finished=false,token=0;
function openLetter(){
  startMusic();
  document.body.classList.remove("closed");
  document.body.classList.add("reading");
  setTimeout(()=>{
    letter.classList.remove("out");letter.classList.add("show");
    if(finished){typed.textContent=message;letter.classList.add("done");return;}  // sudah pernah dibaca: langsung tampil
    const my=++token;let i=0;
    (function type(){
      if(my!==token)return;
      typed.textContent=message.slice(0,i);
      const c=document.createElement("span");c.className="cur";c.innerHTML="&nbsp;";typed.appendChild(c);
      $("scroll").scrollTop=1e6;
      if(i<message.length){i++;setTimeout(type,30);}
      else{finished=true;letter.classList.add("done");}
    })();
  },opened?150:700);
  opened=true;
}
function closeLetter(){
  if(!letter.classList.contains("show")||letter.classList.contains("out"))return;
  token++;finished=true;
  letter.classList.add("out");
  document.body.classList.remove("reading");
  document.body.classList.add("closed");
  setTimeout(()=>letter.classList.remove("show","out"),450);
}
$("readBtn").addEventListener("click",openLetter);
$("clockwrap").addEventListener("click",()=>{if(document.body.classList.contains("closed"))openLetter();});
// tap kotak suratnya = tutup
letter.addEventListener("click",closeLetter);
// tap di luar kotak = tutup juga
document.addEventListener("click",e=>{
  if(document.body.classList.contains("reading")&&!e.target.closest("#letter"))closeLetter();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLetter();});

/* ---------- kata-kata di bawah jam ---------- */
(function(){
  const STANZAS=[["i miss you *every day*.", "i hope you are okay.", "i hope someone is making you laugh the way you deserve,", "and that you're eating on time and sleeping well."], ["i really miss you *every second*.", "in the quiet, in the noise,", "in the middle of a sentence i forget how to finish.", "your name still finds its way into my head like it has a key."], ["but what can i do?", "i can't call you. i can't undo it.", "i can't turn the clock back to the hour we were still \"us\".", "all i can do is keep missing you, quietly,", "and hope that somewhere, you feel it too."]];
  const P=$("poem");let n=0;
  const add=(parent,html,cls)=>{const s=document.createElement("span");s.className="ln "+(cls||"");s.style.setProperty("--i",n++);s.innerHTML=html;parent.appendChild(s);};
  STANZAS.forEach(st=>{
    const d=document.createElement("div");d.className="st";
    st.forEach(l=>add(d,l.replace(/\*(.+?)\*/g,"<em>$1</em>")));
    P.appendChild(d);
  });
  add(P,"i miss you. i really do.","fin script");
  add(P,"tap the clock to read it again","hint");
})();
</script>
